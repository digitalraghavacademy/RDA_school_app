:root {
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  /* Dark blue / gold theme */
  --bg: #050d20;
  --bg2: #081231;
  --surface: #0c1a3d;
  --surface2: #112352;
  --surface3: #183063;
  --line: #22386e;
  --line-soft: rgba(212, 175, 55, 0.22);
  --gold: #d4af37;
  --gold-hi: #f2d878;
  --gold-deep: #9a7a1e;
  --text: #f1f4fc;
  --muted: #a9badb;
  --faint: #6e82a8;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --info: #60a5fa;
}

html, body {
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.font-serif-d {
  font-family: Georgia, "Times New Roman", "Noto Serif", serif;
}

/* ---- Premium logo (CSS only): slightly thicker dotted ovals + a subtle -- */

/* ---- golden glow around the emblem. Applied via .logo-premium on the ---- */

/* ---- Logo SVG in ui.tsx. ---------------------------------------------- */

.logo-premium {
  filter: drop-shadow(0 0 6px rgba(232, 198, 106, 0.45))
    drop-shadow(0 0 1.5px rgba(242, 216, 120, 0.65));
}

.logo-premium ellipse {
  stroke-width: 2.4;
}

/* thin scrollbars for inner scrollers */

.slim-scroll::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}

.slim-scroll::-webkit-scrollbar-thumb {
  background: var(--surface3);
  border-radius: 8px;
}

.slim-scroll::-webkit-scrollbar-track {
  background: transparent;
}

/* Fees "Payment records" table: scrolls in BOTH directions on mobile —
   horizontal scroll keeps every column reachable, vertical scroll (capped at
   400px) keeps every row reachable instead of the list being cut off. */

.payment-records-wrapper {
  overflow-x: auto;
  max-height: 400px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* number inputs: hide spinners for fast marks entry */

input.no-spin::-webkit-outer-spin-button,
input.no-spin::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input.no-spin {
  -moz-appearance: textfield;
  -webkit-appearance: textfield;
          appearance: textfield;
}

select option {
  background: var(--surface2);
  color: var(--text);
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.7) sepia(0.6) saturate(3) hue-rotate(-15deg);
}

/* ------- Splash intro (2nd-video style): two dotted ovals, gold RDA ------ */

/* ------- on #0a1428 — letters appear one by one, then fade out. ---------- */

@keyframes splash-from-left {
  from {
    opacity: 0;
    transform: translateX(-110px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes splash-from-top {
  from {
    opacity: 0;
    transform: translateY(-110px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-oval-in {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) rotate(var(--tilt)) scale(0.8);
  }

  to {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--tilt)) scale(1);
  }
}

@keyframes splash-text-in {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-line-in {
  from {
    opacity: 0;
    transform: scaleX(0);
  }

  to {
    opacity: 1;
    transform: scaleX(1);
  }
}

@keyframes splash-fadeout {
  from {
    opacity: 1;
  }

  to {
    opacity: 0;
  }
}

/* The full 2.5s sequence fades out at the end, handing over to the login. */

.splash-fadeout {
  animation: splash-fadeout 0.45s ease-in 2.05s both;
}

/* Emblem frame: two overlapping dotted oval outlines, rotated ±30° into */

/* an abstract shape, drawn in behind the RDA letters. */

.splash-emblem {
  width: min(80vw, 360px);
  height: min(60vw, 270px);
}

.splash-oval {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(72vw, 330px);
  height: min(54vw, 244px);
  border: 1px dotted rgba(255, 255, 255, 0.6);
  border-radius: 50%;
}

.splash-oval-1 {
  --tilt: 30deg;
  animation: splash-oval-in 1s ease-out 0s both;
}

.splash-oval-2 {
  --tilt: -30deg;
  animation: splash-oval-in 1s ease-out 0.18s both;
}

/* RDA letters: R first from the left, then D, then A — one by one. */

.splash-letter {
  text-shadow: 0 0 34px rgba(232, 198, 106, 0.5);
}

.splash-r {
  animation: splash-from-left 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
}

.splash-d {
  animation: splash-from-top 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
}

.splash-a {
  animation: splash-from-left 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.66s both;
}

.splash-line {
  animation: splash-line-in 0.6s ease-out 1.05s both;
}

.splash-text {
  animation: splash-text-in 0.7s ease-out 1.2s both;
}

@media (prefers-reduced-motion: reduce) {
  .splash-fadeout, .splash-oval-1, .splash-oval-2,
  .splash-r, .splash-d, .splash-a, .splash-text, .splash-line {
    animation: none;
  }
}

<script>
(function(){
  function bind(b){
    if(b.dataset.dragBound) return;
    b.dataset.dragBound="1";
    b.style.touchAction="none";
    var down=false,moved=false,sx=0,sy=0,ox=0,oy=0;
    b.addEventListener("pointerdown",function(e){
      down=true; moved=false; sx=e.clientX; sy=e.clientY;
      var r=b.getBoundingClientRect(); ox=r.left; oy=r.top;
    });
    b.addEventListener("pointermove",function(e){
      if(!down) return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(!moved && Math.abs(dx)+Math.abs(dy)<6) return;
      if(!moved){
        moved=true;
        b.style.left=ox+"px"; b.style.top=oy+"px";
        b.style.right="auto"; b.style.bottom="auto";
        try{ b.setPointerCapture(e.pointerId); }catch(_){}
      }
      var nx=Math.min(Math.max(0,ox+dx), window.innerWidth-b.offsetWidth);
      var ny=Math.min(Math.max(0,oy+dy), window.innerHeight-b.offsetHeight);
      b.style.left=nx+"px"; b.style.top=ny+"px";
    });
    function end(){ down=false; }
    b.addEventListener("pointerup",end);
    b.addEventListener("pointercancel",end);
    b.addEventListener("click",function(e){
      if(moved){ moved=false; e.stopImmediatePropagation(); e.preventDefault(); }
    },true);
  }
  setInterval(function(){
    document.querySelectorAll('button[aria-label^="Ask RDA"],button[aria-label="Close Ask RDA"]').forEach(bind);
  },500);
})();
</script>
<script type="module">
function rdaBanner(msg,color){let b=document.getElementById("rda-net");if(!b){b=document.createElement("div");b.id="rda-net";b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;padding:6px 10px;font:600 12px sans-serif;text-align:center;color:#111";document.body.appendChild(b)}b.style.background=color;b.textContent=msg;if(color==="#2ecc71")setTimeout(()=>b.remove(),3000)}
const safe=(t)=>{try{return JSON.parse(t)}catch(e){return undefined}};
const IS="width:100%;padding:10px;margin:4px 0 12px;border-radius:8px;border:1px solid #334;background:#0e1834;color:#fff;box-sizing:border-box;font-size:16px";
const BS="padding:10px 16px;border:0;border-radius:8px;background:#e8c66a;color:#0b1530;font-weight:700;cursor:pointer";
(async function(){
  let A,F,AU;
  try{
    [A,F,AU]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
  }catch(e){
    rdaBanner("Online data load nahi hua (network). Wi-Fi/mobile data check karke page refresh karein.","#e67e22");
    return;
  }
  const app=A.initializeApp({
    apiKey:"AIzaSyDJfsglbqM7AOXzGErvfkGI8Ooj4TFShIU",
    authDomain:"raghaveacademy.firebaseapp.com",
    projectId:"raghaveacademy",
    storageBucket:"raghaveacademy.firebasestorage.app",
    messagingSenderId:"31663118317",
    appId:"1:31663118317:web:0cc241617a8df864edb9e4"
  });
  const auth=AU.getAuth(app);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
  const pre=()=>(window.rdaSchool&&window.rdaSchool!=="RDA001")?["schools",window.rdaSchool]:[];
  window.rdaFS={db,doc:F.doc,setDoc:F.setDoc,deleteDoc:F.deleteDoc,
    rdaDoc:(...seg)=>F.doc(db,...pre(),...seg),
    rdaCol:(k)=>F.collection(db,...pre(),k)};
  window.addEventListener("rda-save-error",(ev)=>rdaBanner("Save nahi hua: "+ev.detail+" — internet check karein. Data dobara save hoga.","#e74c3c"));

  function gateShow(text){
    let g=document.getElementById("rda-gate");
    if(!g){g=document.createElement("div");g.id="rda-gate";g.style.cssText="position:fixed;inset:0;z-index:100000;background:#0b1530;color:#eee;display:flex;align-items:center;justify-content:center;padding:16px;font-family:sans-serif";document.body.appendChild(g)}
    g.innerHTML='<div style="width:100%;max-width:420px;text-align:center">'+'<svg width="120" height="120" viewBox="0 0 64 64" role="img" aria-label="Raghav Digital Academy logo" style="display:block;margin:0 auto 10px">'+'<circle cx="32" cy="32" r="30" fill="#0a1428"/>'+'<ellipse cx="32" cy="32" rx="27" ry="19" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 3.4" transform="rotate(30 32 32)"/>'+'<ellipse cx="32" cy="32" rx="27" ry="19" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 3.4" transform="rotate(-30 32 32)"/>'+'<text x="32" y="38" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-weight="bold" font-size="14" fill="#e8c66a" letter-spacing="0.5">RDA</text></svg>'+'<p style="color:#e8c66a;letter-spacing:.3em;font-size:11px;margin:0 0 6px">RAGHAV DIGITAL ACADEMY</p>'+'<p style="color:#9fb0d6;font-size:14px;margin:0 0 16px">Begin your school journey with Raghav Digital Academy. Enter your school code to continue.</p>'+'<div style="background:#152248;border-radius:14px;padding:20px;text-align:left">'+'<h2 style="margin:0 0 8px;color:#e8c66a;font-size:20px">School Login</h2>'+'<div style="color:#ffb3b3;min-height:18px;margin-bottom:8px;font-size:14px">'+(text||"")+'</div>'+'<label style="font-size:13px;color:#9fb0d6">School code (जैसे RDA001)</label>'+'<input id="gcode" autocomplete="off" autocapitalize="characters" style="'+IS+'">'+'<label style="font-size:13px;color:#9fb0d6">Password</label>'+'<input id="gpw" type="password" style="'+IS+'">'+'<button id="gbtn" style="'+BS+'">Login</button></div></div>';
    document.getElementById("gbtn").onclick=gateLogin;
  }

  async function loadSchool(code){
    window.rdaSchool=code;
    try{const sd=await F.getDoc(F.doc(db,"schools",code));window.rdaBrand=sd.exists()?{...sd.data(),__school:code}:{__school:code};}catch(e){window.rdaBrand={__school:code}}
    window.rdaReady=false;
    window.rdaCache={};window.rdaIds={};
    let failed=0;let errs=[];
    try{
      const mk=await F.getDoc(window.rdaFS.rdaDoc("meta","keys"));
      if(mk.exists()){
        const mf=safe(mk.data().v)||{};
        window.rdaCache.__manifest=mk.data().v;
        await Promise.all(Object.keys(mf).map(async(k)=>{
          try{
            if(mf[k]==="a"){
              const snap=await F.getDocs(window.rdaFS.rdaCol(k));
              const items=[];const seen={};
              snap.forEach((d)=>{
                const x=d.data();const it=safe(x.v);
                if(it===undefined)return;
                const idx=typeof x.i==="number"?x.i:0;
                items.push({i:idx,item:it});seen[d.id]=1;
                window.rdaCache[k+"/"+d.id]=x.v+"|"+idx;
              });
              items.sort((a,b)=>a.i-b.i);
              window.rdaIds[k]=seen;
              window.N[k]=items.map((q)=>q.item);
            }else{
              const d=await F.getDoc(window.rdaFS.rdaDoc("meta",k));
              const val=d.exists()?safe(d.data().v):undefined;
              if(val!==undefined){window.rdaCache["meta/"+k]=d.data().v;window.N[k]=val}
            }
          }catch(e){failed++;errs.push(k+": "+((e&&(e.code||e.message))||e))}
        }));
      }
      if(failed)rdaBanner("Kuch data online nahi aaya — "+errs.join(" | "),"#e67e22");
      else rdaBanner("Online data (Firebase) load ho gaya — "+code,"#2ecc71");
    }catch(e){
      rdaBanner("Data load nahi hua: "+(e.code||e.message),"#e74c3c");
    }
    window.rdaReady=true;
    window.N.emit();
    if(window.W1)window.W1();
    const g=document.getElementById("rda-gate");if(g)g.remove();
    if(!document.getElementById("rda-logout")){
      const lo=document.createElement("button");lo.id="rda-logout";lo.textContent="School Logout";
      lo.style.cssText="position:fixed;left:8px;bottom:8px;z-index:99998;padding:6px 10px;border-radius:8px;border:1px solid #e8c66a;background:#0b1530;color:#e8c66a;font-size:12px";
      lo.onclick=async()=>{await AU.signOut(auth);location.reload()};
      document.body.appendChild(lo);
    }
  }

  async function ensureUserAndLoad(user,code,sdata){
    const uref=F.doc(db,"users",user.uid);
    let u=await F.getDoc(uref);
    if(!u.exists() && String(sdata.adminEmail||"").trim().toLowerCase()===String(user.email||"").trim().toLowerCase()){
      await F.setDoc(uref,{school:code,role:"Admin"});
      u=await F.getDoc(uref);
    }
    if(!u.exists()||String(u.data().school||"").trim()!==code){
      await AU.signOut(auth);
      gateShow("इस school code के लिए आपका login नहीं है");
      return;
    }
    await loadSchool(code);
  }

  async function gateLogin(){
    const code=document.getElementById("gcode").value.trim().toUpperCase();
    const pw=document.getElementById("gpw").value;
    if(!/^[A-Z]{2,5}\d{3}$/.test(code)){gateShow("School code सही नहीं है (जैसे RDA001)");return}
    if(!pw){gateShow("Password डालें");return}
    document.getElementById("gbtn").disabled=true;
    try{
      const sch=await F.getDoc(F.doc(db,"schools",code));
      if(!sch.exists()||!sch.data().adminEmail){gateShow("School code नहीं मिला या adminEmail नहीं है");return}
      const cred=await AU.signInWithEmailAndPassword(auth,sch.data().adminEmail,pw);
      await ensureUserAndLoad(cred.user,code,sch.data());
    }catch(e){
      const wrong=["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"];
      gateShow(wrong.includes(e.code)?"Email या password गलत है (code: "+e.code+")":"Login नहीं हुआ: "+(e.code||e.message));
    }
  }

  AU.onAuthStateChanged(auth,async(user)=>{
    if(!user){gateShow("");return}
    try{
      const u=await F.getDoc(F.doc(db,"users",user.uid));
      if(!u.exists()){await AU.signOut(auth);gateShow("");return}
      await loadSchool(String(u.data().school||""));
    }catch(e){gateShow("Login जाँच नहीं हुआ: "+(e.code||e.message))}
  });
})();
</script>
