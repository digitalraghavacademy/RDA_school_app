/* ------- Splash intro: R slides from the left, D drops from the top, ------- */

/* ------- A slides from the left — gold on deep blue. ----------------------- */

@keyframes splash-from-left {
  from {
    opacity: 0;
    transform: translateX(-110px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes splash-from-top {
  from {
    opacity: 0;
    transform: translateY(-110px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-text-in {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-line-in {
  from {
    opacity: 0;
    transform: scaleX(0);
  }

  to {
    opacity: 1;
    transform: scaleX(1);
  }
}

.splash-letter {
  text-shadow: 0 0 34px rgba(212, 175, 55, 0.5);
}

.splash-r {
  animation: splash-from-left 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
}

.splash-d {
  animation: splash-from-top 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
}

.splash-a {
  animation: splash-from-left 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.51s both;
}

.splash-text {
  animation: splash-text-in 0.8s ease-out 1.05s both;
}

.splash-line {
  animation: splash-line-in 0.7s ease-out 0.9s both;
}

/* Rotating gold ring around the RDA emblem — the "ghumta hua logo". */

@keyframes splash-rotate {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.splash-rotor {
  animation: splash-rotate 2.5s linear infinite;
}

@media (prefers-reduced-motion: reduce) {
  .splash-r, .splash-d, .splash-a, .splash-text, .splash-line, .splash-rotor {
    animation: none;
  }
}
