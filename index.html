.slim-scroll::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}

.slim-scroll::-webkit-scrollbar-thumb {
  background: var(--surface3);
  border-radius: 8px;
}

.slim-scroll::-webkit-scrollbar-track {
  background: transparent;
}

/* Fees "Payment records" table: scrolls in BOTH directions on mobile —
   horizontal scroll keeps every column reachable, vertical scroll (capped at
   400px) keeps every row reachable instead of the list being cut off. */

.payment-records-wrapper {
  overflow-x: auto;
  max-height: 400px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* number inputs: hide spinners for fast marks entry */

input.no-spin::-webkit-outer-spin-button,
input.no-spin::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input.no-spin {
  -moz-appearance: textfield;
  -webkit-appearance: textfield;
          appearance: textfield;
}

select option {
  background: var(--surface2);
  color: var(--text);
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.7) sepia(0.6) saturate(3) hue-rotate(-15deg);
}

/* ------- Splash intro (2nd-video style): two dotted ovals, gold RDA ------ */

/* ------- on #0a1428 — letters appear one by one, then fade out. ---------- */

@keyframes splash-from-left {
  from {
    opacity: 0;
    transform: translateX(-110px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes splash-from-top {
  from {
    opacity: 0;
    transform: translateY(-110px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-oval-in {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) rotate(var(--tilt)) scale(0.8);
  }

  to {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--tilt)) scale(1);
  }
}

@keyframes splash-text-in {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splash-line-in {
  from {
    opacity: 0;
    transform: scaleX(0);
  }

  to {
    opacity: 1;
    transform: scaleX(1);
  }
}

@keyframes splash-fadeout {
  from {
    opacity: 1;
  }

  to {
    opacity: 0;
  }
}

/* The full 2.5s sequence fades out at the end, handing over to the login. */

.splash-fadeout {
  animation: splash-fadeout 0.45s ease-in 2.05s both;
}

/* Emblem frame: two overlapping dotted oval outlines, rotated ±30° into */

/* an abstract shape, drawn in behind the RDA letters. */

.splash-emblem {
  width: min(80vw, 360px);
  height: min(60vw, 270px);
}

.splash-oval {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(72vw, 330px);
  height: min(54vw, 244px);
  border: 1px dotted rgba(255, 255, 255, 0.6);
  border-radius: 50%;
}

.splash-oval-1 {
  --tilt: 30deg;
  animation: splash-oval-in 1s ease-out 0s both;
}

.splash-oval-2 {
  --tilt: -30deg;
  animation: splash-oval-in 1s ease-out 0.18s both;
}

/* RDA letters: R first from the left, then D, then A — one by one. */

.splash-letter {
  text-shadow: 0 0 34px rgba(232, 198, 106, 0.5);
}

.splash-r {
  animation: splash-from-left 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
}

.splash-d {
  animation: splash-from-top 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
}

.splash-a {
  animation: splash-from-left 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.66s both;
}

.splash-line {
  animation: splash-line-in 0.6s ease-out 1.05s both;
}

.splash-text {
  animation: splash-text-in 0.7s ease-out 1.2s both;
}

@media (prefers-reduced-motion: reduce) {
  .splash-fadeout, .splash-oval-1, .splash-oval-2,
  .splash-r, .splash-d, .splash-a, .splash-text, .splash-line {
    animation: none;
  }
}

(function(){
  // 1. Ask RDA Drag - Moveable
  function initDrag(){
    var b=Array.from(document.querySelectorAll('button')).find(x=>x.textContent.includes('Ask RDA'));
    if(!b) return;
    var box=b.parentElement; if(box.dataset.done) return; box.dataset.done='1';
    box.id='ask-drag-box';
    box.style.cssText='position:fixed;right:20px;bottom:100px;z-index:9999999;cursor:grab;touch-action:none;';
    b.innerHTML='✨ Ask RDA ↕️ Drag';
    var d=false,sx,sy,ox,oy;
    box.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sy=e.clientY;var r=box.getBoundingClientRect();ox=r.left;oy=r.top;box.style.right='auto';box.style.bottom='auto';box.style.left=ox+'px';box.style.top=oy+'px';});
    window.addEventListener('mousemove',function(e){if(!d)return;box.style.left=(ox+e.clientX-sx)+'px';box.style.top=(oy+e.clientY-sy)+'px';});
    window.addEventListener('mouseup',function(){d=false});
    box.addEventListener('touchstart',function(e){d=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;var r=box.getBoundingClientRect();ox=r.left;oy=r.top;box.style.right='auto';box.style.bottom='auto';box.style.left=ox+'px';box.style.top=oy+'px';},{passive:false});
    window.addEventListener('touchmove',function(e){if(!d)return;box.style.left=(ox+e.touches[0].clientX-sx)+'px';box.style.top=(oy+e.touches[0].clientY-sy)+'px';e.preventDefault();},{passive:false});
    window.addEventListener('touchend',function(){d=false});
  }
  setInterval(initDrag,800);

      document.querySelectorAll('button').forEach(function(btn){
        if(btn.textContent.includes('Profile')) return;
        if(btn.querySelector('svg') && btn.closest('div') && btn.closest('div').textContent.includes('Roll')){
          btn.style.setProperty('display','none','important');
        }
      });
    }
  },800);
})();
