// RAGHAV DIGITAL ACADEMY — GOOGLE SHEET AUTO-SYNC (Apps Script)
// ------------------------------------------------------------
// SETUP (sirf ek baar):
// 1. sheets.google.com par "Raghav Academy Data" naam ki spreadsheet banayein, phir Extensions -> Apps Script kholkar ye POORA code paste karein.
// 2. Deploy -> New deployment -> "Web app" chunein, "Execute as" = Me, "Who has access" = Anyone rakhein, Deploy dabakar Web app URL copy karein.
// 3. App me Settings -> Google Sheet Connection me wo URL paste karke "Connect & Save" dabayein — bas! Ab Admission / Marks save hote hi data apne aap sheet me aayega.
// ============================================================

var SPREADSHEET_NAME = "Raghav Academy Data";
var SHEET_STUDENTS = "Students";
var SHEET_MARKS = "MarksRegister";
var SHEET_FEES = "Fees";
var SHEET_APPDATA = "AppData";

var STUDENT_HEADERS = ["Roll No", "Name", "Class", "Board", "DOB", "Gender", "Father", "Mother", "Mobile", "Address", "Admission No", "Session", "Updated At"];
var MARKS_HEADERS = ["Roll No", "Name", "Class", "Session", "Updated At"];
var FEE_HEADERS = ["Date", "Roll No", "Name", "Class", "Amount", "Mode", "Receipt No", "Note", "By"];
var APPDATA_HEADERS = ["Key", "Value", "Updated At"];

function getSS_() {
  var ss = null;
  try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { ss = null; }
  if (ss) return ss;
  var files = DriveApp.getFilesByName(SPREADSHEET_NAME);
  if (files.hasNext()) return SpreadsheetApp.open(files.next());
  return SpreadsheetApp.create(SPREADSHEET_NAME);
}

function getSheet_(ss, name, headers) {
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (sh.getLastRow() === 0 && headers && headers.length) {
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
    sh.setFrozenRows(1);
  }
  return sh;
}

function colOf_(sh, header) {
  var lastCol = sh.getLastColumn();
  if (lastCol < 1) return -1;
  var vals = sh.getRange(1, 1, 1, lastCol).getValues()[0];
  for (var i = 0; i < vals.length; i++) {
    if (String(vals[i]).trim() === header) return i + 1;
  }
  return -1;
}

function ensureCol_(sh, header) {
  var c = colOf_(sh, header);
  if (c > 0) return c;
  c = sh.getLastColumn() + 1;
  sh.getRange(1, c).setValue(header);
  return c;
}

function norm_(v) { return String(v === null || v === undefined ? "" : v).trim(); }
function num_(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

// ---- saveStudent: Roll No (+Class) se match karke update, nahi mila to nayi row ----
function saveStudent_(ss, s) {
  s = s || {};
  var sh = getSheet_(ss, SHEET_STUDENTS, STUDENT_HEADERS);
  var roll = norm_(s.rollNo);
  var cls = norm_(s.className);
  var row = -1;
  var last = sh.getLastRow();
  if (last >= 2 && roll) {
    var data = sh.getRange(2, 1, last - 1, 3).getValues();
    var i;
    for (i = 0; i < data.length; i++) {
      if (norm_(data[i][0]) === roll && norm_(data[i][2]) === cls) { row = i + 2; break; }
    }
    if (row === -1) {
      for (i = 0; i < data.length; i++) {
        if (norm_(data[i][0]) === roll) { row = i + 2; break; }
      }
    }
  }
  var vals = [roll, norm_(s.name), cls, norm_(s.board), norm_(s.dob), norm_(s.gender), norm_(s.father), norm_(s.mother), norm_(s.mobile), norm_(s.address), norm_(s.admissionNo), norm_(s.session), new Date()];
  if (row === -1) sh.appendRow(vals);
  else sh.getRange(row, 1, 1, vals.length).setValues([vals]);
  return { ok: true, action: "saveStudent", rollNo: roll };
}

// ---- saveMarks: ek student = ek row; har Subject_Exam ka apna column (khud ban jata hai) ----
// Example columns: Hindi_1st Test | English_1st Test | Hindi_Half Yearly ...
function saveMarks_(ss, p) {
  p = p || {};
  var sh = getSheet_(ss, SHEET_MARKS, MARKS_HEADERS);
  var roll = norm_(p.rollNo);
  var session = norm_(p.session) || norm_(p.exam);
  var row = -1;
  var last = sh.getLastRow();
  if (last >= 2 && roll) {
    var data = sh.getRange(2, 1, last - 1, 4).getValues();
    var i;
    for (i = 0; i < data.length; i++) {
      if (norm_(data[i][0]) === roll && norm_(data[i][3]) === session) { row = i + 2; break; }
    }
    if (row === -1) {
      for (i = 0; i < data.length; i++) {
        if (norm_(data[i][0]) === roll) { row = i + 2; break; }
      }
    }
  }
  if (row === -1) {
    row = sh.getLastRow() + 1;
    sh.getRange(row, 1, 1, 5).setValues([[roll, norm_(p.studentName), norm_(p.className), session, new Date()]]);
  } else {
    sh.getRange(row, 2).setValue(norm_(p.studentName));
    sh.getRange(row, 3).setValue(norm_(p.className));
    sh.getRange(row, 4).setValue(session);
    sh.getRange(row, 5).setValue(new Date());
  }
  var exam = norm_(p.exam);
  var marks = p.marks || [];
  for (var k = 0; k < marks.length; k++) {
    var m = marks[k] || {};
    var subj = norm_(m.subject);
    if (!subj) continue;
    var total = num_(m.theory) + num_(m.practical);
    var colName = subj + "_" + exam;
    sh.getRange(row, ensureCol_(sh, colName)).setValue(total);
    sh.getRange(row, ensureCol_(sh, colName + " (Max)")).setValue(num_(m.maxMarks));
  }
  return { ok: true, action: "saveMarks", rollNo: roll, exam: exam };
}

// ---- saveFee: har payment ek nayi row ----
function saveFee_(ss, f) {
  f = f || {};
  var sh = getSheet_(ss, SHEET_FEES, FEE_HEADERS);
  sh.appendRow([norm_(f.date) || new Date(), norm_(f.rollNo), norm_(f.studentName), norm_(f.className), num_(f.amount), norm_(f.mode), norm_(f.receiptNo), norm_(f.note), norm_(f.by)]);
  return { ok: true, action: "saveFee" };
}

function setAppData_(ss, key, value) {
  var sh = getSheet_(ss, SHEET_APPDATA, APPDATA_HEADERS);
  var last = sh.getLastRow();
  var row = -1;
  if (last >= 2) {
    var keys = sh.getRange(2, 1, last - 1, 1).getValues();
    for (var i = 0; i < keys.length; i++) {
      if (norm_(keys[i][0]) === key) { row = i + 2; break; }
    }
  }
  if (row === -1) sh.appendRow([key, value, new Date()]);
  else sh.getRange(row, 2, 1, 2).setValues([[value, new Date()]]);
}

// ---- getAll: saari tabs ka poora data wapas bhejein ----
function getAll_(ss) {
  var out = {};
  var names = [SHEET_STUDENTS, SHEET_MARKS, SHEET_FEES, SHEET_APPDATA];
  for (var i = 0; i < names.length; i++) {
    var sh = ss.getSheetByName(names[i]);
    out[names[i]] = sh ? sh.getDataRange().getValues() : [];
  }
  return { ok: true, action: "getAll", sheets: out };
}

function route_(ss, p) {
  var action = norm_(p.action);
  if (action === "saveStudent") return saveStudent_(ss, p.student);
  if (action === "saveMarks") return saveMarks_(ss, p);
  if (action === "saveFee") return saveFee_(ss, p.fee);
  if (action === "getAll") return getAll_(ss);
  if (action === "ping") {
    setAppData_(ss, "lastPing", norm_(p.at) || new Date().toISOString());
    return { ok: true, action: "ping", at: new Date().toISOString() };
  }
  return { ok: false, error: "Unknown action: " + action };
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var ss = getSS_();
    var p = {};
    try {
      p = JSON.parse((e && e.postData && e.postData.contents) || "{}");
    } catch (err2) {
      p = (e && e.parameter) || {};
    }
    return jsonOut_(route_(ss, p));
  } catch (err) {
    return jsonOut_({ ok: false, error: String((err && err.message) || err) });
  }
}

function doGet(e) {
  try {
    var action = norm_(e && e.parameter && e.parameter.action);
    if (action === "getAll") return jsonOut_(getAll_(getSS_()));
  } catch (err) { /* ignore */ }

  .outer { max-width: 780px; margin: 0 auto; background: #fff; border: 8px solid #102a63; border-radius: 18px; box-shadow: 0 0 0 3px #f4c95d; }
  .inner { border: 1.5px solid #f4c95d; border-radius: 10px; margin: 4px; position: relative; overflow: hidden; }

  .content { position: relative; padding: 32px; }
  .head { text-align: center; }
  .logo-wrap { width: 86px; height: 86px; margin: 0 auto; border-radius: 50%; padding: 3px; background: linear-gradient(135deg,#102a63,#f4c95d); }
  .logo-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; display: block; }
  .logo-wrap .mono { width: 100%; height: 100%; border-radius: 50%; background: #102a63; color: #f4c95d; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; }
  .head h1 { color: #102a63; letter-spacing: 0.05em; margin: 12px 0 0; font-size: 30px; }
  .motto { color: #5d6b8a; font-size: 11px; letter-spacing: 0.28em; margin-top: 6px; font-weight: 700; }
  .rule { height: 2px; max-width: 460px; margin: 16px auto; border-radius: 2px; background: linear-gradient(90deg, transparent, #f4c95d 20%, #102a63 50%, #f4c95d 80%, transparent); }
  .badge { display: inline-block; background: linear-gradient(90deg,#102a63,#1e3a7a); color: #f4c95d; font-weight: 800; font-size: 13px; letter-spacing: 0.06em; padding: 8px 20px; border-radius: 999px; border: 1px solid #f4c95d; }
  .idbox { display: flex; align-items: stretch; margin-top: 22px; border: 1.8px solid #102a63; border-radius: 12px; overflow: hidden; }
  .photo { width: 110px; height: 132px; object-fit: cover; border-right: 1.8px solid #102a63; background: #f4f6fb; flex-shrink: 0; }
  .photo.ph { display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; color: #fff; background: #102a63; }
  .details { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  .d { padding: 9px 12px; border-bottom: 1px solid #d7e0f0; }
  .d .k { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: #7a8ab0; font-weight: 800; }
  .d .v { display: block; font-weight: 800; color: #102a63; margin-top: 2px; font-size: 13px; border-bottom: 1px dotted #a9b7d1; padding-bottom: 2px; }
  table.marks { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
  table.marks th { background: #102a63; color: #fff; padding: 11px 6px; font-weight: 900; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  table.marks th.gold { color: #f4c95d; }
  table.marks td { border: 1px solid #dfe8f5; padding: 10px 6px; text-align: center; font-weight: 600; }
  table.marks td.subj { text-align: left; font-weight: 800; color: #102a63; padding-left: 12px; }
  table.marks td.obt { font-weight: 900; color: #102a63; font-size: 14px; }
  tr.total td { background: rgba(244,201,93,0.28); font-weight: 900; color: #102a63; border-top: 2px solid #102a63; font-size: 14px; }
  .grade { display: inline-block; min-width: 32px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 900; }
  .g-green { background: #0a7a3a; color: #fff; }
  .g-red { background: #c0262d; color: #fff; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; max-width: 440px; }
  .sum-box { border-radius: 12px; padding: 12px 8px; text-align: center; }
  .sum-box.dark { background: linear-gradient(135deg,#102a63,#1e3a7a); border: 1.5px solid #f4c95d; }
  .sum-box.light { background: #fff; border: 1.8px solid #102a63; }
  .sum-box .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 800; }
  .sum-box.dark .k { color: #f4c95d; }
  .sum-box.light .k { color: #7a8ab0; }
  .sum-box .v { font-size: 22px; font-weight: 900; margin-top: 4px; }
  .sum-box.dark .v { color: #fff; }
  .sign { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 48px; }
  .who { text-align: center; font-size: 12px; min-width: 150px; }
  .line { width: 150px; border-top: 2px solid #102a63; margin: 0 auto 8px; }
  .who .label { font-weight: 900; color: #102a63; font-size: 12px; }
  .foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid #e2eaf6; font-size: 10px; color: #8a97b3; text-align: center; }
  @page { size: A4; margin: 8mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .outer { box-shadow: none; border-radius: 0; max-width: none; }
    .inner { border-radius: 0; }
