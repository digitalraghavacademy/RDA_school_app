:root {
  --bg: #0a1930;
  --bg-deep: #060f20;
  --surface: #0f2242;
  --surface-2: #13294f;
  --gold: #d4af37;
  --gold-soft: #e8c96a;
  --gold-deep: #a8842a;
  --ink: #f4f1e6;
  --ink-dim: #b9c2d8;
  --line: rgba(212, 175, 55, 0.22);
  --card-line: rgba(212, 175, 55, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a1930;
    --bg-deep: #050c1b;
    --surface: #0f2242;
    --surface-2: #142a52;
    --ink: #f6f2e7;
    --ink-dim: #bcc6dc;
  }
}

* {
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-x: clip;
}

.font-display {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
}

.gold-text {
  background: linear-gradient(120deg, #f3dd8f 0%, #d4af37 45%, #f0d070 70%, #b8912f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.dotted-oval {
  border: 2px dotted var(--gold);
  border-radius: 9999px;
}

.hero-glow {
  background:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(212, 175, 55, 0.16), transparent 70%),
    radial-gradient(ellipse 45% 35% at 85% 30%, rgba(64, 110, 200, 0.18), transparent 70%),
    radial-gradient(ellipse 45% 35% at 12% 35%, rgba(64, 110, 200, 0.14), transparent 70%);
}

.card-sheen {
  position: relative;
  overflow: hidden;
}

.card-sheen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.09), transparent 45%);
  pointer-events: none;
}

.tick {
  color: var(--gold);
  flex-shrink: 0;
}

.float-slow {
  animation: floaty 7s ease-in-out infinite;
}

@keyframes floaty {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-12px);
  }
}

.reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .float-slow {
    animation: none;
  }

  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }

  html {
    scroll-behavior: auto;
  }
}
